<style>
:root{
  --bg:#070708; --surface:#141417; --surface2:#1C1C20; --line:#2C2C31; --line2:#3A3A41;
  --text:#F4F4F5; --muted:#A1A1AA; --dim:#71717A;
  --red:#DD001F; --red-deep:#7A0011; --red-soft:rgba(221,0,31,.14);
  --head:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
a{color:inherit}

/* ---------- encabezado ---------- */
.top{color:#fff;background:linear-gradient(115deg,#000 0%,#160003 42%,#5C000D 72%,var(--red) 100%);border-bottom:1px solid #000}
.top-in{max-width:1080px;margin:0 auto;padding:18px 20px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.logo img{height:46px;width:46px;display:block;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.wordmark{font-family:var(--head);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1;background:#fff;color:var(--red);padding:4px 10px 3px;border-radius:3px}
.titles h1{font-family:var(--head);font-weight:700;font-size:22px;margin:0;line-height:1.1}
.titles p{margin:2px 0 0;color:rgba(255,255,255,.72);font-size:14px}
.conn{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
.conn.off i{background:transparent;border:1.5px solid #fff}
.conn.pend{background:#fff;color:#000;border-color:#fff;font-weight:600}
.conn.pend i{background:var(--red)}
.conn button{all:unset;cursor:pointer;text-decoration:underline}

.crumbs{max-width:1080px;margin:0 auto;padding:14px 20px 0;display:flex;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumbs{align-items:center;gap:12px}
.crumbs .trail{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a.back{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#000;font-weight:700;font-size:15px;padding:9px 16px 9px 12px;min-height:42px;border-radius:6px}
.crumbs a.back svg{width:16px;height:16px}
.crumbs a.back:hover{background:#E4E4E7;color:#000}
body.form-mode .crumbs a.back{background:#18181B;color:#fff}
body.form-mode .crumbs a.back:hover{background:#000;color:#fff}
.crumbs a:hover{color:#fff}
.crumbs span.sep{color:var(--dim)}
.crumbs b{color:#fff;font-weight:600}

main{max-width:1080px;margin:0 auto;padding:10px 20px 120px}
.lead{font-family:var(--head);font-weight:700;font-size:clamp(28px,5vw,40px);margin:18px 0 4px;line-height:1.05}
.sub{color:var(--muted);margin:0 0 22px;max-width:62ch}

/* ---------- mosaicos de navegación ---------- */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{position:relative;display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 20px 18px;text-decoration:none;overflow:hidden;transition:border-color .15s, background .15s}
.tile:hover{border-color:var(--red);background:var(--surface2)}
.tile .big{font-family:var(--head);font-weight:800;font-size:44px;line-height:.95;letter-spacing:-.01em;display:block;overflow-wrap:normal;word-break:normal;hyphens:none}
.tile .code{position:absolute;right:14px;top:10px;font-family:var(--head);font-weight:800;font-size:64px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.14);pointer-events:none}
.tile .meta{display:block;margin-top:10px;color:var(--muted);font-size:14px}
.tile .meta b{color:#fff;font-weight:600}
.tile .bar{display:block;height:3px;background:var(--line);margin-top:14px;border-radius:2px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--red)}
.tile.country{padding:28px 24px 24px;min-height:180px;background:linear-gradient(160deg,var(--surface) 55%,#2a0007 100%)}
.tiles.countries{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.tile.country .big{font-size:clamp(38px,5.4vw,60px)}
.tile.country .flag{position:absolute;right:20px;top:20px;width:112px;height:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.22),0 6px 18px rgba(0,0,0,.45)}
.tile.country .big{padding-right:124px}
.lead.with-flag{display:flex;align-items:center;gap:14px}
.flag-sm{width:56px;height:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.22)}
.tile.off{opacity:.55;pointer-events:none}
.tile.off .meta{color:var(--dim)}
.tile .last{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.tile .last b{color:#fff}
.tile.line .big{font-size:48px}

/* ---------- formulario ---------- */
.ut{font-size:13px;color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.grid{display:grid;gap:14px 16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid .full{grid-column:1/-1}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
label.f em,.hdr em{color:var(--red);font-style:normal}
.inp{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;min-height:44px;color:#fff}
.inp:focus{border-color:#fff;outline:none}
textarea.inp{min-height:72px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.inp.bad{border-color:var(--red)!important;box-shadow:0 0 0 1px var(--red)!important}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;border-right:1px solid var(--line2);padding:9px 14px;min-height:42px;color:var(--muted);font-weight:600}
.seg button:last-child{border-right:0}
.seg button.on{background:#fff;color:#000}
.seg.bad{box-shadow:0 0 0 2px var(--red)}
.hide{display:none!important}

/* hoja blanca: cuando se entra al formulario todo cambia a papel */
body.form-mode{background:#E6E6E9;color:#18181B}
body.form-mode .crumbs,body.form-mode .crumbs a{color:#5B5B63}
body.form-mode .crumbs a:hover{color:#000}
body.form-mode .crumbs b{color:#000}
.sheet{background:#fff;color:#18181B;border-top:6px solid var(--red);border-radius:4px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:20px 22px 16px;border-bottom:2px solid #18181B}
.doc-type{font-size:13px;color:var(--red);font-weight:600}
.sheet-head h2{font-family:var(--head);font-weight:800;font-size:clamp(30px,5vw,42px);margin:2px 0 0;line-height:1}
.sheet .ut{color:#5B5B63}
.doc-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:#5B5B63}
.sheet label.f{color:#3F3F46}
.sheet .inp{background:#fff;color:#18181B;border:1px solid #C4C4CC;min-height:40px;padding:8px 10px}
.sheet .inp:focus{border-color:#18181B;box-shadow:0 0 0 1px #18181B}
.sheet .inp::placeholder{color:#A1A1AA}
.sheet .seg{border-color:#C4C4CC}
.sheet .seg button{color:#52525B;border-right-color:#C4C4CC;min-height:38px;padding:7px 12px}
.sheet .seg button.on{background:#18181B;color:#fff}

table.hdr{width:100%;border-collapse:collapse}
table.hdr th,table.hdr td{border-bottom:1px solid #D4D4D8;padding:10px 14px;text-align:left;vertical-align:middle}
table.hdr th{background:#F4F4F5;font-weight:600;font-size:13px;color:#3F3F46;width:15%;white-space:nowrap}
table.hdr td{width:35%}
table.hdr td.fixed{font-weight:600;color:#18181B}

.tbl-wrap{overflow-x:auto}
table.acts{width:100%;border-collapse:collapse;font-size:15px}
table.acts thead th{background:#18181B;color:#fff;text-align:left;font-weight:600;font-size:13px;padding:10px 12px;white-space:nowrap}
table.acts td{border-bottom:1px solid #E4E4E7;padding:8px 12px;vertical-align:middle}
tr.secrow th{background:#FBE5E8;color:#7A0011;text-align:left;font-family:var(--head);font-size:18px;font-weight:700;padding:9px 12px;border-bottom:1px solid #F2BCC4}
tr.secrow{scroll-margin-top:12px}
tr.secrow .step{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#7A0011;color:#fff;font-size:14px;margin-right:10px;vertical-align:2px}
.flow{padding:14px 22px;border-bottom:1px solid #D4D4D8;background:#FAFAFA}
.flow-t{display:block;font-size:13px;font-weight:600;color:#3F3F46;margin-bottom:8px}
.flow-steps{display:flex;align-items:center;gap:4px;overflow-x:auto;padding-bottom:4px}
.fstep{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:#fff;border:1px solid #C4C4CC;border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;font-weight:600;color:#3F3F46}
.fstep b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#E4E4E7;color:#18181B;font-size:12px}
.fstep:hover{border-color:#18181B}
.fstep.full{border-color:#16A34A;color:#15803D}
.fstep.full b{background:#16A34A;color:#fff}
.fstep.has-no{border-color:var(--red);color:var(--red)}
.fstep.has-no b{background:var(--red);color:#fff}
.flow-steps .arr{color:#A1A1AA;font-size:18px;flex:none}
tr.secrow .cnt{float:right;font-family:var(--body);font-size:13px;font-weight:600;color:#7A0011}
.nf{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:8px}
.c-no{width:72px;color:#71717A;font-size:13px;font-variant-numeric:tabular-nums}
.c-eq{width:15%;color:#3F3F46;font-size:14px}
.c-fq{width:112px;font-size:13px;color:#52525B}
.c-res{width:250px}
.c-obs{width:19%}
.mini{display:none}
tr.item.no>td{background:#FFF1F3}
tr.item.missing>td{background:#FFE1E6}
tr.item.missing>td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.ans{display:flex;gap:6px}
.ans button{flex:1;background:#fff;border:2px solid currentColor;border-radius:6px;min-height:44px;padding:6px 10px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ans button.c{color:#15803D}
.ans button.n{color:#DD001F}
.ans button.c:not(.on):hover{background:#ECF8F0}
.ans button.n:not(.on):hover{background:#FDECEE}
.ans button.c.on{background:#16A34A;border-color:#16A34A;color:#fff}
.ans button.n.on{background:var(--red);border-color:var(--red);color:#fff}
tr.item.ok>td{background:#ECF8F0}
.ans svg{width:17px;height:17px;flex:none}

tr.hzrow{display:none}
tr.item.no+tr.hzrow{display:table-row}
tr.hzrow>td{padding:0 12px 14px;background:#FFF1F3;border-bottom:1px solid #E4E4E7}
.hz{border:1px solid #F2BCC4;border-left:4px solid var(--red);background:#fff;border-radius:4px;padding:14px}
.hz-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hz-head h4{margin:0;font-family:var(--head);font-size:18px;font-weight:700}
.hz-auto{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:#52525B}
.hz-auto b{color:#18181B;font-weight:600}
.hz-auto b.st{color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #C4C4CC;background:#fff;border-radius:4px;padding:7px 14px;min-height:40px;font-weight:600;color:#52525B}
.chip.on{background:#18181B;color:#fff;border-color:#18181B}
.chips.bad .chip{border-color:var(--red)}
[data-hpick] .chip.on{background:var(--red);border-color:var(--red);color:#fff}
.follow{margin-top:14px;border:1px dashed #C4C4CC;border-radius:4px;padding:9px 12px;font-size:13px;color:#52525B}
.obs-gen{padding:16px 22px 22px;border-top:2px solid #18181B}

/* barra inferior */
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(7,7,8,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;backdrop-filter:blur(6px)}
.dock-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.prog{flex:1;min-width:0}
.prog .nums{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.prog .nums b{color:#fff}
.prog .track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:var(--red);transition:width .25s}
.btn{border:0;border-radius:4px;padding:12px 20px;min-height:46px;font-weight:600;font-family:var(--head);font-size:18px;letter-spacing:.01em}
.btn.pri{background:var(--red);color:#fff}
.btn.pri:hover{background:#f00025}
.btn.sec{background:transparent;border:1px solid var(--line2);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}

body.form-mode .dock{background:rgba(255,255,255,.97);border-top-color:#D4D4D8}
body.form-mode .prog .nums{color:#52525B}
body.form-mode .prog .nums b{color:#18181B}
body.form-mode .prog .nums .k-ok,body.form-mode .prog .nums .k-ok b{color:#15803D}
body.form-mode .prog .nums .k-no,body.form-mode .prog .nums .k-no b{color:#DD001F}
body.form-mode .prog .track{background:#E4E4E7}

/* resultado */
.done{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;margin-top:18px}
.score{font-family:var(--head);font-weight:800;font-size:clamp(72px,14vw,120px);line-height:.9}
.score small{font-size:.35em;color:var(--muted);font-weight:600}
.status-msg{border-left:4px solid #fff;padding:10px 14px;background:var(--surface2);margin:14px 0;font-size:15px}
.status-msg.warn{border-color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.hz-list{list-style:none;margin:0;padding:0}
.hz-list li{border-top:1px solid var(--line);padding:12px 0}
.hz-list li:first-child{border-top:0}
.hz-list .t{font-weight:600}
.hz-list .m{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.empty{color:var(--muted);padding:20px 0}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:4px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:90vw}
body.form-mode .toast{background:#18181B;color:#fff}

/* tablet */
@media (min-width:761px) and (max-width:1100px){
  main{padding-left:16px;padding-right:16px}
  .c-eq{display:none}
  .mini{display:block;font-size:12px;color:#71717A;margin-bottom:2px}
  .c-no{width:62px}
  .c-res{width:250px}
  .c-obs{width:24%}
  table.hdr th{width:auto}
  .ans button{min-height:48px}
}
@media (max-width:760px){
  .crumbs .trail{display:none}
  table.hdr,table.hdr tbody,table.hdr tr{display:block}
  table.hdr th,table.hdr td{display:block;width:auto;border:0}
  table.hdr th{padding:10px 14px 4px;background:transparent}
  table.hdr td{padding:0 14px 10px;border-bottom:1px solid #E4E4E7}
  table.acts thead{display:none}
  table.acts,table.acts tbody{display:block}
  tr.secrow,tr.secrow th{display:block}
  tr.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;padding:12px;border-bottom:1px solid #E4E4E7}
  tr.item>td{border:0;padding:0;background:transparent!important;box-shadow:none!important}
  tr.item.no{background:#FFF1F3}
  tr.item.ok{background:#ECF8F0}
  tr.item.missing{background:#FFE1E6;box-shadow:inset 4px 0 0 var(--red)}

const ORG = {
  GT: { nombre: 'Guatemala',  unidades: { TUBOACERO:{lineas:[]}, TECHOACERO:{lineas:[]}, MAYACERO:{lineas:[]} } },
  CR: { nombre: 'Costa Rica', unidades: { TUBOACERO:{lineas:[]}, TECHOACERO:{lineas:[]} } }
};
const PAIS_COD = {'guatemala':'GT','gt':'GT','costa rica':'CR','cr':'CR'};
let CAT = {};   // "GT|TUBOACERO|633" -> [ {name, items:[{c,d,f}]} ]
const ACT_KEY = 'autonomo:actividades';
function aplicarCatalogo(rows){
  const cat = {};
  Object.values(ORG).forEach(p => Object.values(p.unidades).forEach(u => u.lineas = []));
  (rows || []).forEach(r => {
    const pc = PAIS_COD[String(r.pais||'').trim().toLowerCase()];
    const un = String(r.unidad||'').trim().toUpperCase(), ln = String(r.linea||'').trim(), act = String(r.actividad||'').trim();
    if (!pc || !un || !ln || !act) return;
    if (!ORG[pc].unidades[un]) ORG[pc].unidades[un] = { lineas: [] };
    const k = `${pc}|${un}|${ln}`;
    if (!cat[k]) { cat[k] = []; ORG[pc].unidades[un].lineas.push(ln); }
    const secNom = String(r.seccion||'').trim() || 'General';
    let sec = cat[k].find(s => s.name === secNom);
    if (!sec) { sec = { name: secNom, items: [] }; cat[k].push(sec); }
    sec.items.push({ c: String(r.equipo||'').trim() || secNom, d: act, f: ['S'] });
  });
  CAT = cat;
}

    const r = await api('actividades', {});

    const antes = JSON.stringify(CAT);

    if (JSON.stringify(CAT) !== antes && !document.getElementById('secs')) route();   // no interrumpe un checklist a medio llenar
  } catch(e){}
}

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const hoy = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtFecha = s => { if(!s) return '—'; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : s; };
const uid = p => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase();
const lineItems = k => (CAT[k]||[]).flatMap((s,si) => s.items.map((it,ii) => ({...it, sec:s.name, id:`s${si}i${ii}`})));
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

function inferTipoHallazgo(d){
  d = d.toLowerCase();
  if (/fuga/.test(d)) return 'Fuga';
  if (/limpi|sopletea|retirar|elimina/.test(d)) return 'Limpieza';
  if (/engras|lubric|nivel.*aceite|aceite/.test(d)) return 'Lubricación';
  if (/apret|apriet|ajust|alinea/.test(d)) return 'Ajuste / apriete';
  return 'Inspección';
}
function inferFalla(d){
  d = d.toLowerCase();
  if (/hidr[aá]ul/.test(d)) return ['Hidráulico'];
  if (/el[eé]ctric|sensor|panel|encoder|cable|motor|inductor|generador|iluminaci/.test(d)) return ['Eléctrico'];
  return ['Mecánico'];
}

/* ---------- conexión con el servidor (Apps Script) ---------- */
const enAppsScript = () => !!(window.google && google.script && google.script.run);
const hayServidor = () => enAppsScript() || !!API_URL;
function api(action, payload){
  if (enAppsScript()) return new Promise((res, rej) =>
    google.script.run.withSuccessHandler(r => r && r.ok ? res(r) : rej(new Error((r&&r.error)||'Error del servidor')))
      .withFailureHandler(rej).api(action, payload||{}));
  if (!API_URL) return Promise.reject(new Error('sin-servidor'));
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, payload: payload||{}}) })
    .then(r => r.json()).then(r => { if(!r.ok) throw new Error(r.error||'Error del servidor'); return r; });
}
const PEND_KEY = 'autonomo:pendientes', HIST_KEY = 'autonomo:historial';
let resumenServidor = null, conectado = null;

function pintarConexion(){
  const el = $('#conn'), pend = store.get(PEND_KEY, []).length;
  el.className = 'conn' + (pend ? ' pend' : conectado ? '' : ' off');
  if (pend) el.innerHTML = `<i></i><span>${pend} sin enviar · <button id="retry">Enviar ahora</button></span>`;
  else if (!hayServidor()) el.innerHTML = '<i></i><span>Sin servidor configurado</span>';
  else el.innerHTML = conectado ? '<i></i><span>Conectado</span>' : '<i></i><span>Sin conexión</span>';
  const b = $('#retry'); if (b) b.onclick = () => enviarPendientes(true);
}
async function enviarPendientes(avisar){
  let pend = store.get(PEND_KEY, []);
  if (!pend.length || !hayServidor()) { pintarConexion(); return; }
  const quedan = [];
  for (const p of pend){
    try { await api('registrarChecklist', p); marcarHistorial(p.checklist.id, true); }
    catch(e){ quedan.push(p); }
  }
  store.set(PEND_KEY, quedan);
  conectado = quedan.length < pend.length || conectado;
  pintarConexion();
  if (avisar) toast(quedan.length ? `Quedan ${quedan.length} sin enviar. Revisa la conexión.` : 'Todo enviado al servidor.');
}
async function cargarResumen(){
  if (!hayServidor()) { conectado = false; pintarConexion(); return; }
  try { const r = await api('resumen', {}); resumenServidor = r.checklists || []; conectado = true; }
  catch(e){ conectado = false; }
  pintarConexion();
  if (!RUTA.split('/')[3]) route();   // refresca los mosaicos con lo último
}
function marcarHistorial(id, enviado){
  const h = store.get(HIST_KEY, []); const x = h.find(r => r.id === id); if (x) { x.enviado = enviado; store.set(HIST_KEY, h); }
}
function ultimos(linea){
  const loc = store.get(HIST_KEY, []).filter(r => r.linea === linea);
  const srv = (resumenServidor||[]).filter(r => r.linea === linea);
  const map = new Map(); [...srv, ...loc].forEach(r => map.set(r.id, r));
  return [...map.values()].sort((a,b) => String(b.fechaRegistro||b.fechaRevision).localeCompare(String(a.fechaRegistro||a.fechaRevision)));
}

/* ---------- navegación ---------- */
function crumbs(parts){
  const atras = parts.length >= 2 ? parts[parts.length-2].h : '#/';
  const back = parts.length ? `<a class="back" href="${atras}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Regresar</a>` : '';
  const out = ['<a href="#/">Inicio</a>'];
  parts.forEach((p,i) => { out.push('<span class="sep">/</span>'); out.push(i === parts.length-1 ? `<b>${esc(p.t)}</b>` : `<a href="${p.h}">${esc(p.t)}</a>`); });
  $('#crumbs').innerHTML = parts.length ? back + '<span class="trail">' + out.join('') + '</span>' : '';
}
function route(){
  document.body.classList.remove('form-mode');
  const [, pais, unidad, linea] = RUTA.replace(/^#/,'').split('/').map(decodeURIComponent);
  $('#dockSlot').innerHTML = '';
  if (pais && ORG[pais] && unidad && ORG[pais].unidades[unidad] && linea && CAT[`${pais}|${unidad}|${linea}`]) return vistaFormulario(pais, unidad, linea);
  if (pais && ORG[pais] && unidad && ORG[pais].unidades[unidad]) return vistaLineas(pais, unidad);
  if (pais && ORG[pais]) return vistaUnidades(pais);
  return vistaInicio();
}
/* La navegación no depende de que el navegador cambie la URL: así funciona
   igual abierto como archivo, en vista previa o dentro de Apps Script. */
let RUTA = (() => { try { return location.hash || '#/'; } catch(e){ return '#/'; } })();
function ir(ruta){
  RUTA = ruta || '#/';
  try { if (location.hash !== RUTA) history.pushState(null, '', RUTA); } catch(e){}
  route(); window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  ir(a.getAttribute('href'));
});
window.addEventListener('popstate', () => { try { RUTA = location.hash || '#/'; } catch(e){} route(); });
window.addEventListener('hashchange', () => { try { RUTA = location.hash || '#/'; } catch(e){} route(); });

function vistaInicio(){
  crumbs([]);
  const tiles = Object.entries(ORG).map(([code, p]) => {
    const unidades = Object.keys(p.unidades);
    const lineas = unidades.reduce((n,u) => n + p.unidades[u].lineas.length, 0);
    return `<a class="tile country" href="#/${code}">
      <img class="flag" src="${BANDERAS[code]}" alt="Bandera de ${esc(p.nombre)}">
      <span class="big">${esc(p.nombre)}</span>
      <span class="meta"><b>${unidades.length}</b> unidades de negocio · ${unidades.join(', ')}</span>
      <span class="meta">${lineas ? `<b>${lineas}</b> líneas con checklist` : 'Checklists por cargar'}</span>
    </a>`;
  }).join('');
  $('#view').innerHTML = `<h2 class="lead">¿Dónde estás hoy?</h2>
    <p class="sub">Elige el país, la unidad de negocio y la línea para llenar el checklist de mantenimiento autónomo del turno.</p>
    <div class="tiles countries">${tiles}</div>`;
}
function vistaUnidades(pais){
  const p = ORG[pais];
  crumbs([{t:p.nombre, h:`#/${pais}`}]);
  const tiles = Object.entries(p.unidades).map(([u, cfg]) => {
    const n = cfg.lineas.length, act = cfg.lineas.reduce((s,l) => s + lineItems(`${pais}|${u}|${l}`).length, 0);
    return `<a class="tile${n ? '' : ' off'}" href="#/${pais}/${encodeURIComponent(u)}" ${n ? '' : 'aria-disabled="true" tabindex="-1"'}>
      <span class="code">${pais}</span>
      <span class="big">${esc(u)}</span>
      <span class="meta">${n ? `<b>${n}</b> líneas · <b>${act}</b> actividades` : 'Checklists por cargar'}</span>
    </a>`;
  }).join('');
  $('#view').innerHTML = `<h2 class="lead with-flag"><img class="flag-sm" src="${BANDERAS[pais]}" alt="">${esc(p.nombre)}</h2><p class="sub">Unidades de negocio</p><div class="tiles">${tiles}</div>`;
}
function vistaLineas(pais, unidad){
  const p = ORG[pais], cfg = p.unidades[unidad];
  crumbs([{t:p.nombre, h:`#/${pais}`}, {t:unidad, h:`#/${pais}/${encodeURIComponent(unidad)}`}]);
  const tiles = cfg.lineas.map(l => {
    const its = lineItems(`${pais}|${unidad}|${l}`);
    const u = ultimos(l)[0], draft = store.get(draftKey(pais, unidad, l), null);
    const avance = draft ? Object.values(draft.resp||{}).filter(r => r.r).length : 0;
    return `<a class="tile line" href="#/${pais}/${encodeURIComponent(unidad)}/${encodeURIComponent(l)}">
      <span class="big">${esc(l)}</span>
      <span class="meta">${esc(UT[l]||'')}</span>
      <span class="meta"><b>${its.length}</b> actividades · frecuencia semanal</span>
      ${avance ? `<span class="meta">Borrador guardado: <b>${avance}/${its.length}</b> respondidas</span>` : ''}
      <span class="last">${u ? `<span>Último: <b>${fmtFecha(u.fechaRevision)}</b></span><span><b>${u.cumplimiento}%</b> · ${u.hallazgos} hallazgo${u.hallazgos==1?'':'s'}</span>` : '<span>Sin registros todavía</span>'}</span>
    </a>`;
  }).join('');
  $('#view').innerHTML = `<h2 class="lead">${esc(unidad)} ${esc(p.nombre)}</h2><p class="sub">Elige la línea para llenar su checklist semanal.</p><div class="tiles">${tiles}</div>`;
}

/* ---------- formulario ---------- */
let F = null;   // estado del formulario activo
const numOp = n => String(n * 10).padStart(4, '0');

  const p = ORG[pais];
  document.body.classList.add('form-mode');
  crumbs([{t:p.nombre, h:`#/${pais}`}, {t:unidad, h:`#/${pais}/${encodeURIComponent(unidad)}`}, {t:'Línea ' + linea}]);
  const key = draftKey(pais, unidad, linea), CK = `${pais}|${unidad}|${linea}`;
  const items = lineItems(CK);
  const base = { meta:{ fecha:hoy(), turno:'', operador:'', supervisor:'', estado:'', alcance:'todas', obsGeneral:'' }, resp:{} };
  const saved = store.get(key, null);
  F = { pais, unidad, linea, key, items, st: saved && saved.meta ? saved : base };
  const m = F.st.meta;

  let n = 0;
  const filas = CAT[CK].map((s, si) => {
    const rows = s.items.map((it, ii) => itemHTML({...it, sec:s.name, id:`s${si}i${ii}`}, ++n)).join('');

  }).join('');

  $('#view').innerHTML = `
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <div class="doc-type">Orden de trabajo · Mantenimiento autónomo</div>
        <h2>Línea ${esc(linea)}</h2>
        <div class="ut">${esc(unidad)} ${esc(p.nombre)} · UT ${esc(UT[linea]||'')}</div>
      </div>
      <div class="doc-meta"><span>Inspección / Limpieza / Lubricación</span><span>${items.length} actividades</span></div>
    </div>

    <table class="hdr" aria-label="Datos del checklist">
      <tr>
        <th><label for="m-fecha">Fecha de revisión <em>*</em></label></th>
        <td><input class="inp" type="date" id="m-fecha" data-m="fecha" value="${esc(m.fecha)}"></td>
        <th>Turno <em>*</em></th>
        <td><div class="seg" data-mseg="turno">${['1','2','3'].map(t => `<button type="button" data-v="${t}" class="${m.turno===t?'on':''}">${t}</button>`).join('')}</div></td>
      </tr>
      <tr>
        <th><label for="m-op">Operador(es) <em>*</em></label></th>
        <td><input class="inp" id="m-op" data-m="operador" value="${esc(m.operador)}" placeholder="Nombre de quien hace el checklist"></td>
        <th><label for="m-sup">Supervisor / líder</label></th>
        <td><input class="inp" id="m-sup" data-m="supervisor" value="${esc(m.supervisor)}" placeholder="Opcional"></td>
      </tr>
      <tr>
        <th>Estado del equipo</th>
        <td class="fixed">En funcionamiento y parada</td>
        <th>Frecuencia</th>
        <td class="fixed">Semanal</td>
      </tr>
    </table>

    <nav class="flow" aria-label="Recorrido de la línea">
      <span class="flow-t">Recorrido de la línea</span>
      <div class="flow-steps">${CAT[CK].map((s, si) => `<button type="button" class="fstep" data-go="${si}"><b>${si+1}</b>${esc(s.name)}</button>`).join('<span class="arr" aria-hidden="true">›</span>')}</div>
    </nav>

    <div class="tbl-wrap">
      <table class="acts" id="secs">
        <thead><tr>
          <th class="c-no">No. Oper</th><th class="c-eq">Equipo</th><th class="c-act">Actividad</th><th class="c-res">Verificación</th><th class="c-obs">Observación</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>

    <div class="obs-gen">
      <label class="f" for="m-obs">Observaciones generales del turno</label>
      <textarea class="inp" id="m-obs" data-m="obsGeneral" placeholder="Opcional">${esc(m.obsGeneral)}</textarea>
    </div>
  </div>`;

  $('#dockSlot').innerHTML = `<div class="dock"><div class="dock-in">
    <div class="prog"><div class="nums" id="nums"></div><div class="track"><i id="bar"></i></div></div>
    <button class="btn pri" id="enviar" type="button">Enviar checklist</button>
  </div></div>`;

  items.forEach(it => { const r = F.st.resp[it.id]; if (r && r.r) aplicarRespuesta(it.id, r.r, true); });
  aplicarAlcance();
  enlazarFormulario();
  actualizarProgreso();
}

  const r = (F.st.resp[it.id]) || {};
  const h = r.h || {};
  const tf = h.tipoFalla || inferFalla(it.d + ' ' + it.c);
  const th = h.tipoHallazgo || inferTipoHallazgo(it.d);
  return `<tr class="item" data-id="${it.id}" data-f="${it.f.join('')}">
    <td class="c-no">${numOp(n)}</td>
    <td class="c-eq">${esc(it.c)}</td>
    <td class="c-act"><span class="mini">${esc(it.c)}</span>${esc(it.d)}</td>
    <td class="c-res"><div class="ans" role="group" aria-label="Verificación">
      <button type="button" class="c" data-r="C" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 8.5l3.2 3L13 4.5"/></svg>Cumple</button>
      <button type="button" class="n" data-r="N" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 4l8 8M12 4l-8 8"/></svg>No cumple</button>
    </div></td>
    <td class="c-obs"><input class="inp" data-k="obs" value="${esc(r.obs||'')}" placeholder="Opcional"></td>
  </tr>
  <tr class="hzrow" data-id="${it.id}"><td colspan="5">
    <div class="hz" aria-label="Hallazgo">
      <div class="hz-head">
        <h4>No cumple · ${esc(it.d)}</h4>
        <div class="hz-auto"><span>Línea: <b>${esc(F.linea)}</b></span><span>Frecuencia: <b>Semanal</b></span><span>Detectó: <b>Producción</b></span><span>Status: <b class="st">Abierta</b></span></div>
      </div>
      <div class="grid">
        <div class="full"><label class="f">¿Por qué no cumple? <em>*</em></label><div class="chips" data-hpick="motivo">${MOTIVOS.map(t => `<button type="button" class="chip${h.motivo===t?' on':''}" data-v="${t}">${t}</button>`).join('')}</div></div>
        <div class="full"><label class="f">Descripción de la falla <em>*</em></label><textarea class="inp" data-h="observacion" placeholder="Qué encontraste y dónde: ej. gotea aceite en la manguera de entrada del cilindro">${esc(h.observacion||'')}</textarea></div>
        <div><label class="f">Equipo <em>*</em></label><input class="inp" data-h="equipo" value="${esc(h.equipo!=null ? h.equipo : it.c)}"></div>
        <div><label class="f">Subequipo (opcional)</label><input class="inp" data-h="subequipo" value="${esc(h.subequipo||'')}" placeholder="Ej. Acabado"></div>
        <div><label class="f">Tipo de falla <em>*</em></label><div class="chips" data-hchips="tipoFalla">${TIPOS_FALLA.map(t => `<button type="button" class="chip${tf.includes(t)?' on':''}" data-v="${t}">${t}</button>`).join('')}</div></div>
        <div><label class="f">Criticidad</label><select class="inp" data-h="criticidad">${CRITICIDAD.map(t => `<option${t===(h.criticidad||'Media')?' selected':''}>${t}</option>`).join('')}</select></div>
        <div class="full"><label class="f">Evidencia o comentarios</label><input class="inp" data-h="evidencia" value="${esc(h.evidencia||'')}" placeholder="Opcional"></div>
      </div>
      <div class="follow">No. de aviso, No. de OT, acción y seguimiento, responsable de cierre, fecha compromiso y fecha de cierre los completa mantenimiento.</div>
    </div>
  </td></tr>`;
}

function getResp(id){
  if (!F.st.resp[id]) F.st.resp[id] = {};
  return F.st.resp[id];
}
function hDefaults(it){
  return { motivo:'', equipo: it.c, subequipo:'', observacion:'', tipoFalla: inferFalla(it.d + ' ' + it.c), tipoHallazgo: inferTipoHallazgo(it.d), criticidad:'Media', evidencia:'' };
}
function aplicarRespuesta(id, r, silencioso){
  const el = $(`.item[data-id="${id}"]`); if (!el) return;
  const it = F.items.find(i => i.id === id);
  const resp = getResp(id);
  resp.r = r;
  if (r === 'N' && !resp.h) resp.h = hDefaults(it);
  el.classList.toggle('no', r === 'N');
  el.classList.toggle('ok', r === 'C');
  el.classList.remove('missing');
  el.querySelectorAll('.ans button').forEach(b => { const on = b.dataset.r === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  if (!silencioso){ guardar(); actualizarProgreso(); }
}
let tGuardar;
function guardar(){ clearTimeout(tGuardar); tGuardar = setTimeout(() => store.set(F.key, F.st), 250); }

let enlazado = false;
function enlazarFormulario(){
  $('#enviar').onclick = enviar;
  if (enlazado) return; enlazado = true;
  const v = $('#view');
  v.addEventListener('click', e => {
    if (!F || !document.getElementById('secs')) return;
    const a = e.target.closest('.ans button');
    if (a){ const id = a.closest('[data-id]').dataset.id; const cur = (F.st.resp[id]||{}).r; aplicarRespuesta(id, cur === a.dataset.r ? null : a.dataset.r); return; }
    const pick = e.target.closest('[data-hpick] .chip');
    if (pick){
      const grp = pick.parentNode, id = pick.closest('[data-id]').dataset.id, resp = getResp(id);
      resp.h = resp.h || hDefaults(F.items.find(i => i.id === id));
      grp.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === pick));
      resp.h[grp.dataset.hpick] = pick.dataset.v;
      grp.classList.remove('bad'); guardar(); return;
    }
    const chip = e.target.closest('[data-hchips] .chip');
    if (chip){
      chip.classList.toggle('on');
      const id = chip.closest('[data-id]').dataset.id, h = getResp(id).h;
      h.tipoFalla = [...chip.parentNode.querySelectorAll('.chip.on')].map(c => c.dataset.v);
      chip.parentNode.classList.remove('bad'); guardar(); return;
    }
    const go = e.target.closest('[data-go]');
    if (go){ const r = document.getElementById('sec-' + go.dataset.go); if (r) r.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    const sb = e.target.closest('[data-mseg] button');
    if (sb){
      const grp = sb.parentNode, k = grp.dataset.mseg;
      grp.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sb));
      grp.classList.remove('bad');
      F.st.meta[k] = sb.dataset.v;
      if (k === 'alcance') { aplicarAlcance(); actualizarProgreso(); }
      guardar(); return;
    }
  });
  v.addEventListener('input', e => {
    if (!F || !document.getElementById('secs')) return;
    const t = e.target;
    t.classList.remove('bad');
    if (t.dataset.m){ F.st.meta[t.dataset.m] = t.value; guardar(); return; }
    const row = t.closest('[data-id]'); if (!row) return;
    const id = row.dataset.id, resp = getResp(id);
    if (t.dataset.k === 'obs') resp.obs = t.value;
    if (t.dataset.h){ resp.h = resp.h || hDefaults(F.items.find(i => i.id === id)); resp.h[t.dataset.h] = t.value; }
    guardar();
  });
  v.addEventListener('change', e => { if (e.target.matches('select[data-h]')) e.target.dispatchEvent(new Event('input', {bubbles:true})); });
}
function enAlcance(it){ return true; }   // una sola frecuencia: semanal
function aplicarAlcance(){
  F.items.forEach(it => document.querySelectorAll(`[data-id="${it.id}"]`).forEach(r => r.classList.toggle('hide', !enAlcance(it))));
  document.querySelectorAll('tr.secrow').forEach(s => {
    const vis = F.items.some(i => i.id.startsWith(`s${s.dataset.sec}i`) && enAlcance(i));
    s.classList.toggle('hide', !vis);
  });
}
function actualizarProgreso(){
  const vis = F.items.filter(enAlcance);
  const resp = vis.filter(i => (F.st.resp[i.id]||{}).r);
  const c = vis.filter(i => (F.st.resp[i.id]||{}).r === 'C').length;
  const n = vis.filter(i => (F.st.resp[i.id]||{}).r === 'N').length;
  const pct = vis.length ? Math.round(resp.length / vis.length * 100) : 0;
  $('#bar').style.width = pct + '%';
  $('#nums').innerHTML = `<span><b>${resp.length}/${vis.length}</b> respondidas</span><span class="k-ok"><b>${c}</b> cumple</span><span class="k-no"><b>${n}</b> no cumple</span>`;
  document.querySelectorAll('tr.secrow').forEach(s => {
    const its = F.items.filter(i => i.id.startsWith(`s${s.dataset.sec}i`) && enAlcance(i));
    const ok = its.filter(i => (F.st.resp[i.id]||{}).r).length;
    const nn = its.filter(i => (F.st.resp[i.id]||{}).r === 'N').length;
    s.querySelector('.cnt').innerHTML = `${ok}/${its.length}${nn ? `<span class="nf">${nn} no cumple</span>` : ''}`;
    const fs = document.querySelector(`.fstep[data-go="${s.dataset.sec}"]`);
    if (fs){ fs.classList.toggle('full', ok === its.length && its.length > 0); fs.classList.toggle('has-no', nn > 0); }
  });
}

/* ---------- validar y enviar ---------- */
function validar(){
  const m = F.st.meta, errores = [];
  let primero = null;
  const marcar = (el, msg) => { if (el) { el.classList.add('bad'); if (!primero) primero = el; } errores.push(msg); };
  if (!m.fecha) marcar($('#m-fecha'), 'Falta la fecha de revisión');
  if (!m.turno) marcar($('[data-mseg="turno"]'), 'Falta el turno');
  if (!String(m.operador).trim()) marcar($('#m-op'), 'Falta el operador');
  F.items.filter(enAlcance).forEach(it => {
    const r = F.st.resp[it.id] || {}, el = $(`.item[data-id="${it.id}"]`), hz = $(`.hzrow[data-id="${it.id}"]`);
    if (!r.r){ el.classList.add('missing'); if (!primero) primero = el; errores.push('x'); return; }
    if (r.r === 'N'){
      const h = r.h || {};
      if (!h.motivo) marcar(hz.querySelector('[data-hpick="motivo"]'), 'Falta indicar por qué no cumple');
      if (!String(h.equipo||'').trim()) marcar(hz.querySelector('[data-h="equipo"]'), 'Falta el equipo');
      if (!String(h.observacion||'').trim()) marcar(hz.querySelector('[data-h="observacion"]'), 'Falta la descripción de la falla');
      if (!(h.tipoFalla||[]).length) marcar(hz.querySelector('[data-hchips]'), 'Falta el tipo de falla');
    }
  });
  if (primero) primero.scrollIntoView({behavior:'smooth', block:'center'});
  return errores;
}
function construirEnvio(){
  const m = F.st.meta, vis = F.items.filter(enAlcance), id = uid('CHK'), ahora = new Date().toISOString();
  const operador = m.operador.trim();
  const detalle = vis.map(it => { const r = F.st.resp[it.id]; return {
    checklistId:id, fechaRevision:m.fecha, pais:ORG[F.pais].nombre, unidad:F.unidad, linea:F.linea,
    seccion:it.sec, equipo:it.c, actividad:it.d, frecuencia:'Semanal',
    resultado: r.r === 'C' ? 'Cumple' : 'No cumple', observacion:(r.obs||'').trim() }; });
  const hallazgos = vis.filter(it => F.st.resp[it.id].r === 'N').map((it, k) => { const r = F.st.resp[it.id], h = r.h; return {
    id: id.replace('CHK','HZ') + '-' + String(k+1).padStart(2,'0'), checklistId:id,
    status:'Abierta', fechaRevision:m.fecha, motivo:h.motivo, pais:ORG[F.pais].nombre, unidad:F.unidad, linea:F.linea,
    equipo:h.equipo.trim(), subequipo:(h.subequipo||'').trim(), observacion:h.observacion.trim(),
    actividad:it.d, tipoFalla:h.tipoFalla, noAviso:'', noOT:'', tipoHallazgo: MOTIVO_A_TIPO[h.motivo] || h.tipoHallazgo || inferTipoHallazgo(it.d), criticidad:h.criticidad,
    quienDetecto:'Producción', operador, frecuencia:'Semanal',
    accion:'', responsableCierre:'', fechaCompromiso:'', fechaCierre:'',
    evidencia:[(h.evidencia||'').trim(), (r.obs||'').trim()].filter(Boolean).join(' · '), fechaRegistro:ahora }; });
  const cumple = detalle.filter(d => d.resultado === 'Cumple').length;
  const checklist = { id, fechaRegistro:ahora, fechaRevision:m.fecha, pais:ORG[F.pais].nombre, unidad:F.unidad, linea:F.linea, ut:UT[F.linea]||'',
    turno:m.turno, operador, supervisor:(m.supervisor||'').trim(), estadoEquipo:'En funcionamiento y parada',
    alcance:'Semanal',
    actividades:detalle.length, cumple, noCumple:detalle.length-cumple,
    cumplimiento: detalle.length ? Math.round(cumple/detalle.length*1000)/10 : 0,
    hallazgos:hallazgos.length, obsGeneral:(m.obsGeneral||'').trim() };
  return { checklist, detalle, hallazgos };
}
async function enviar(){
  const err = validar();
  if (err.length){
    const faltan = err.filter(e => e === 'x').length;
    toast(faltan ? `Faltan ${faltan} actividades por responder` : err.find(e => e !== 'x'));
    return;
  }
  const btn = $('#enviar'); btn.disabled = true; btn.textContent = 'Enviando…';
  const envio = construirEnvio();
  const h = store.get(HIST_KEY, []);
  h.unshift({ id:envio.checklist.id, linea:F.linea, fechaRevision:envio.checklist.fechaRevision, fechaRegistro:envio.checklist.fechaRegistro, cumplimiento:envio.checklist.cumplimiento, hallazgos:envio.checklist.hallazgos, enviado:false });
  store.set(HIST_KEY, h.slice(0,80));
  // 1) se guarda primero en el teléfono, 2) se muestra el resultado al instante, 3) se envía por detrás
  const p = store.get(PEND_KEY, []); p.push(envio); store.set(PEND_KEY, p);
  store.del(F.key);
  vistaResultado(envio, 'enviando');
  let ok = false, motivo = '';
  try { await api('registrarChecklist', envio); ok = true; conectado = true; marcarHistorial(envio.checklist.id, true);
        store.set(PEND_KEY, store.get(PEND_KEY, []).filter(x => x.checklist.id !== envio.checklist.id)); }
  catch(e){ motivo = e.message; }
  pintarConexion();
  const el = document.getElementById('estadoEnvio');
  if (el) el.outerHTML = mensajeEnvio(envio, ok ? 'ok' : 'error', motivo);
}
function mensajeEnvio(envio, estado, motivo){
  const c = envio.checklist;
  if (estado === 'enviando') return `<div class="status-msg" id="estadoEnvio">Enviando… ya puedes regresar o cerrar: el checklist quedó guardado en este teléfono y se termina de enviar solo.</div>`;
  if (estado === 'ok') return `<div class="status-msg" id="estadoEnvio">Checklist enviado. ${c.hallazgos ? `${c.hallazgos} hallazgo${c.hallazgos==1?'':'s'} quedaron como <b>Abierta</b> y en un minuto aparecen en el dashboard de autónomos.` : 'Sin hallazgos.'}</div>`;
  return `<div class="status-msg warn" id="estadoEnvio">${motivo === 'sin-servidor' ? 'No hay servidor configurado: el checklist quedó guardado en este dispositivo.' : 'Sin conexión: el checklist quedó guardado en este teléfono y se enviará solo al recuperar señal.'} También puedes descargarlo en CSV.</div>`;
}

function vistaResultado(envio, estado, motivo){
  document.body.classList.remove('form-mode');
  const c = envio.checklist;
  $('#dockSlot').innerHTML = '';
  crumbs([{t:ORG[F.pais].nombre, h:`#/${F.pais}`}, {t:F.unidad, h:`#/${F.pais}/${encodeURIComponent(F.unidad)}`}, {t:'Línea ' + F.linea + ' · resultado'}]);
  const msg = mensajeEnvio(envio, estado, motivo);
  const lista = envio.hallazgos.length ? `<ul class="hz-list">${envio.hallazgos.map(h => `<li><div class="t">${esc(h.motivo)} · ${esc(h.equipo)}${h.subequipo ? ' · ' + esc(h.subequipo) : ''}</div><div>${esc(h.observacion)}</div><div class="m">Línea ${esc(h.linea)} · ${esc(h.tipoFalla.join(', '))} · Criticidad ${esc(h.criticidad)}</div></li>`).join('')}</ul>` : '<p class="empty">Todas las actividades cumplen.</p>';
  $('#view').innerHTML = `
  <div class="done">
    <section class="card">
      <div class="score">${c.cumplimiento}<small>%</small></div>
      <div style="color:var(--muted)">de cumplimiento · ${c.cumple} de ${c.actividades} actividades</div>
      ${msg}
      <dl class="kv">
        <dt>Línea</dt><dd>${esc(c.linea)} · ${esc(c.unidad)} ${esc(c.pais)}</dd>
        <dt>Fecha</dt><dd>${fmtFecha(c.fechaRevision)} · Turno ${esc(c.turno)}</dd>
        <dt>Operador</dt><dd>${esc(c.operador)}</dd>
        <dt>Estado</dt><dd>${esc(c.estadoEquipo)}</dd>
        <dt>Frecuencia</dt><dd>Semanal</dd>
        <dt>Folio</dt><dd>${esc(c.id)}</dd>
      </dl>
      <div class="actions">
        <a class="btn pri" href="#/${F.pais}/${encodeURIComponent(F.unidad)}" style="text-decoration:none;display:inline-flex;align-items:center">Ir a líneas</a>
        <button class="btn sec" id="csv" type="button">Descargar CSV</button>
      </div>
    </section>
    <section class="card">
      <h3 style="font-family:var(--head);font-size:22px;margin:0 0 6px">Hallazgos (${envio.hallazgos.length})</h3>
      ${lista}
    </section>
  </div>`;
  $('#csv').onclick = () => descargarCSV(envio);
  window.scrollTo(0,0);
}
function descargarCSV(envio){
  const q = v => '"' + String(Array.isArray(v) ? v.join(', ') : (v==null?'':v)).replace(/"/g,'""') + '"';
  const c = envio.checklist;
  const filas = [['Folio','Fecha revisión','Turno','Línea','Sección','Equipo','Actividad','Frecuencia','Resultado','Observación','Por qué no cumple','Descripción de la falla','Tipo de falla','Tipo de hallazgo','Criticidad']];
  envio.detalle.forEach(d => {
    const h = envio.hallazgos.find(x => x.actividad === d.actividad && x.equipo && d.resultado === 'No cumple') || {};
    filas.push([c.id, c.fechaRevision, c.turno, c.linea, d.seccion, d.equipo, d.actividad, d.frecuencia, d.resultado, d.observacion, h.motivo||'', h.observacion||'', h.tipoFalla||'', h.tipoHallazgo||'', h.criticidad||'']);
  });
  const blob = new Blob(['\ufeff' + filas.map(r => r.map(q).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Checklist_${c.linea.replace(/[^\w]/g,'')}_${c.fechaRevision}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- arranque ---------- */
if (LOGO_SRC) $('#logoSlot').innerHTML = `<img src="${LOGO_SRC}" alt="Multi">`;
window.addEventListener('online', () => enviarPendientes(false));
aplicarCatalogo(store.get(ACT_KEY, null) || BASE_ACT);
route();
pintarConexion();
cargarActividades();
cargarResumen().then(() => enviarPendientes(false));
</script>
